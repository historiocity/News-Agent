<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brief — Archive</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1a1a18; --muted: #6b6a66; --rule: #e0ddd6; --link: #1c4f8a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #e8e6e1; --muted: #96948d; --rule: #2e2e34; --link: #8ab4e8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header { border-bottom: 2px solid var(--fg); padding-bottom: 1rem; margin-bottom: 2rem; }
  h1 {
    margin: 0; font-size: 2rem; letter-spacing: -0.02em; line-height: 1.15;
  }
  .sub { color: var(--muted); font-size: 0.95rem; margin-top: 0.4rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--rule); padding: 0.9rem 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .date { font-variant-numeric: tabular-nums; }
  .empty {
    color: var(--muted); font-style: italic; padding: 2rem 0;
  }
  footer {
    margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Brief</h1>
    <div class="sub">Archive — newest first</div>
  </header>

  <!-- Regenerated by the news-brief skill on each run from the issues/ directory. -->
  <ul id="archive">
  </ul>

  <p class="empty">No issues yet. The first run will populate this page.</p>

  <footer>
    Generated by the <code>news-brief</code> skill.
  </footer>
</div>
</body>
</html>
